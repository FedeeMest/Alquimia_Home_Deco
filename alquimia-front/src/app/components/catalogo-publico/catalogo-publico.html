<div class="container mx-auto p-4 lg:p-8 mt-4 text-center animate-fade-in">
    <h1 class="text-4xl font-extrabold text-slate-800 tracking-tight mb-4">
        Catálogo Online
    </h1>
    <p class="text-lg text-slate-500 max-w-2xl mx-auto mb-10">
        Descubrí nuestros productos destacados.
    </p>

    <div *ngIf="cargando" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
        <div *ngFor="let item of [1,2,3,4,5,6,7,8]" class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 animate-pulse h-72"></div>
    </div>

    <div *ngIf="!cargando && productos.length === 0" class="text-slate-500 py-10 font-medium text-lg">
        No hay productos disponibles en este momento. ¡Volvé pronto!
    </div>

    <div *ngIf="!cargando && productos.length > 0" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6 text-left">
        
        <div *ngFor="let p of productos" class="bg-white rounded-2xl shadow-sm hover:shadow-xl transition-shadow border border-slate-100 overflow-hidden flex flex-col group">
            
            <div class="h-56 bg-slate-100 relative overflow-hidden flex items-center justify-center">
                <img *ngIf="p.imagenUrl" [src]="p.imagenUrl" [alt]="p.nombre" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
                <svg *ngIf="!p.imagenUrl" class="w-16 h-16 text-slate-300" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M2.25 15.75l5.159-5.159a2.25 2.25 0 013.182 0l5.159 5.159m-1.5-1.5 1.409-1.409a2.25 2.25 0 013.182 0l2.909 2.909m-18 3.75h16.5a1.5 1.5 0 001.5-1.5V6a1.5 1.5 0 00-1.5-1.5H3.75A1.5 1.5 0 002.25 6v12a1.5 1.5 0 001.5 1.5zm10.5-11.25h.008v.008h-.008V8.25zm.375 0a.375.375 0 11-.75 0 .375.375 0 01.75 0z" />
                </svg>
                
                <div *ngIf="!p.disponible" class="absolute top-3 right-3 bg-red-500 text-white text-xs font-bold px-2.5 py-1 rounded-lg shadow-sm">Agotado</div>
                <div *ngIf="p.categoria" class="absolute bottom-3 left-3 bg-white/90 backdrop-blur text-slate-800 text-[10px] font-bold uppercase tracking-wider px-2 py-1 rounded-md shadow-sm">{{ p.categoria }}</div>
            </div>

            <div class="p-5 flex flex-col flex-1">
                <h3 class="font-bold text-slate-800 text-lg mb-1 line-clamp-2 leading-tight">{{ p.nombre }}</h3>
                <div class="text-2xl font-black text-emerald-600 mb-5 mt-auto">
                    {{ p.precio | currency:'ARS':'symbol-narrow':'1.0-0' }}
                </div>
                
                <button (click)="agregarAlCarrito(p)" [disabled]="!p.disponible" class="w-full bg-slate-900 hover:bg-slate-800 disabled:bg-slate-300 text-white font-bold py-3 rounded-xl transition-all active:scale-95 flex items-center justify-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5">
                      <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 10.5V6a3.75 3.75 0 1 0-7.5 0v4.5m11.356-1.993 1.263 12c.07.665-.45 1.243-1.119 1.243H4.25a1.125 1.125 0 0 1-1.12-1.243l1.264-12A1.125 1.125 0 0 1 5.513 7.5h12.974c.576 0 1.059.435 1.119 1.007ZM8.625 10.5a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Zm7.5 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Z" />
                    </svg>
                    {{ p.disponible ? 'Sumar al Carrito' : 'Sin Stock' }}
                </button>
            </div>
        </div>

    </div>
</div>
