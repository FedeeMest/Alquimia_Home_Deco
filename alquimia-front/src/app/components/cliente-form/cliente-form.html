<div class="container mx-auto p-4 max-w-4xl animate-fade-in-up">
    
    <div class="flex items-center gap-4 mb-8">
        <a routerLink="/admin/clientes" class="p-2 bg-white rounded-xl border border-slate-200 text-slate-500 hover:text-slate-800 hover:bg-slate-50 shadow-sm transition-all active:scale-95">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-5 h-5"><path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5 3 12m0 0 7.5-7.5M3 12h18" /></svg>
        </a>
        <div>
            <h1 class="text-3xl font-extrabold text-slate-800 tracking-tight">
                {{ isEditMode ? 'Editar Cliente' : 'Nuevo Cliente' }}
            </h1>
            <p class="text-slate-500 font-medium mt-1">Completá los datos correspondientes en el formulario.</p>
        </div>
    </div>

    <div class="bg-white rounded-2xl shadow-xl shadow-slate-200/50 border border-slate-200 overflow-hidden relative">
        <div *ngIf="loading" class="absolute inset-0 bg-white/70 backdrop-blur-sm z-20 flex justify-center items-center">
            <svg class="animate-spin h-10 w-10 text-slate-800" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
        </div>

        <form (ngSubmit)="guardar()" #formCliente="ngForm">
            <div class="p-6 md:p-8 space-y-6">
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="col-span-2 md:col-span-1">
                        <label class="block text-xs font-bold text-slate-500 uppercase tracking-widest mb-2">Nombre Completo / Razón Social <span class="text-red-500">*</span></label>
                        <input type="text" [(ngModel)]="cliente.nombre" name="nombre" required class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm text-slate-800 focus:bg-white focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none transition-all shadow-inner font-medium">
                    </div>

                    <div class="col-span-2 md:col-span-1">
                        <label class="block text-xs font-bold text-slate-500 uppercase tracking-widest mb-2">Tipo de Cliente</label>
                        <select [(ngModel)]="cliente.tipo" name="tipo" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm text-slate-800 focus:bg-white focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none transition-all shadow-inner font-medium cursor-pointer">
                            <option value="Minorista">Minorista</option>
                            <option value="Mayorista">Mayorista</option>
                            <option value="Feria">Feria</option>
                            <option value="Familia">Familia</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-xs font-bold text-slate-500 uppercase tracking-widest mb-2">Teléfono</label>
                        <input type="text" [(ngModel)]="cliente.telefono" name="telefono" placeholder="Ej: 341 555-1234" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm text-slate-800 focus:bg-white focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none transition-all shadow-inner">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-500 uppercase tracking-widest mb-2">CUIT / DNI</label>
                        <input type="text" [(ngModel)]="cliente.cuit" name="cuit" placeholder="Sin guiones" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm text-slate-800 focus:bg-white focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none transition-all shadow-inner">
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-xs font-bold text-slate-500 uppercase tracking-widest mb-2">Email</label>
                        <input type="email" [(ngModel)]="cliente.email" name="email" placeholder="correo@ejemplo.com" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm text-slate-800 focus:bg-white focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none transition-all shadow-inner">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-500 uppercase tracking-widest mb-2">Dirección / Domicilio</label>
                        <input type="text" [(ngModel)]="cliente.direccion" name="direccion" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm text-slate-800 focus:bg-white focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none transition-all shadow-inner">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase tracking-widest mb-2">Notas u Observaciones</label>
                    <textarea [(ngModel)]="cliente.notas" name="notas" rows="3" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm text-slate-800 focus:bg-white focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none transition-all shadow-inner resize-none custom-scrollbar" placeholder="Preferencias, horarios de entrega..."></textarea>
                </div>

            </div>

            <div class="px-6 py-5 border-t border-slate-200 bg-slate-50 flex justify-end gap-3">
                <a routerLink="/admin/clientes" class="px-6 py-2.5 bg-white border border-slate-300 text-slate-600 hover:text-slate-900 hover:bg-slate-100 font-bold rounded-xl text-sm transition-colors shadow-sm">
                    Cancelar
                </a>
                <button type="submit" [disabled]="!formCliente.form.valid || loading" class="px-8 py-2.5 bg-slate-900 hover:bg-slate-800 disabled:opacity-50 disabled:bg-slate-400 text-white font-bold rounded-xl text-sm transition-colors shadow-md flex items-center gap-2">
                    {{ isEditMode ? 'Actualizar Cliente' : 'Guardar Cliente' }}
                </button>
            </div>
        </form>
    </div>
</div>
