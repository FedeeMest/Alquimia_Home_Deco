<div class="min-h-screen flex flex-col bg-slate-50 font-sans selection:bg-slate-900 selection:text-white">
  
  <nav class="bg-white/95 backdrop-blur-md border-b border-slate-200 sticky top-0 z-50 shadow-sm">
    <div class="container mx-auto px-4 lg:px-8 py-3">
      
      <div class="grid grid-cols-3 items-center">
        
        <div class="hidden md:flex items-center gap-8 justify-start">
          <a routerLink="/" 
             routerLinkActive="text-black border-b-2 border-black" 
             [routerLinkActiveOptions]="{exact: true}"
             class="text-sm font-bold text-slate-500 hover:text-black transition-colors uppercase tracking-[0.15em] pb-1">
             Inicio
          </a>
          <a routerLink="/catalogo" 
             routerLinkActive="text-black border-b-2 border-black"
             class="text-sm font-bold text-slate-500 hover:text-black transition-colors uppercase tracking-[0.15em] pb-1">
             Catálogo
          </a>
        </div>

        <div class="md:hidden flex items-center justify-start">
           <button class="text-slate-600 hover:text-black p-2">
              <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
           </button>
        </div>
        
        <div class="flex justify-center">
          <a routerLink="/" class="group flex flex-col items-center text-center">
            <span class="font-black text-2xl md:text-3xl tracking-tighter text-slate-900 uppercase leading-none">
              Alquimia
            </span>
            <span class="font-bold text-[9px] md:text-[10px] tracking-[0.4em] text-slate-400 uppercase mt-1 group-hover:text-slate-900 transition-colors ml-1">
              Home Deco
            </span>
          </a>
        </div>

        <div class="flex items-center justify-end gap-4">
           </div>

      </div>
    </div>
  </nav>

  <main class="flex-grow">
    <router-outlet></router-outlet>
  </main>

  <footer class="bg-white border-t border-slate-200 pt-16 pb-8 mt-auto">
      <div class="container mx-auto px-4 lg:px-8">
          <div class="grid grid-cols-1 md:grid-cols-12 gap-12 md:gap-8 mb-16">
              
              <div class="md:col-span-4">
                  <div class="flex flex-col items-start mb-6">
                      <span class="font-black text-3xl tracking-tighter text-slate-900 uppercase leading-none">Alquimia</span>
                      <span class="font-bold text-[10px] tracking-[0.4em] text-slate-400 uppercase mt-1 ml-1">Home Deco</span>
                  </div>
                  <p class="text-slate-500 font-medium leading-relaxed max-w-sm">
                      Creamos ambientes únicos con diseño de autor. Calidad premium en cada detalle para transformar tu hogar.
                  </p>
              </div>

              <div class="md:col-span-4 md:col-start-9 flex flex-col sm:items-end">
                  <h4 class="text-sm font-black text-slate-900 uppercase tracking-widest mb-6">Navegación</h4>
                  <nav class="flex flex-col gap-4 sm:items-end">
                      <a routerLink="/" class="text-slate-500 hover:text-black font-bold transition-colors">Inicio</a>
                      <a routerLink="/catalogo" class="text-slate-500 hover:text-black font-bold transition-colors">Catálogo Completo</a>
                  </nav>
              </div>
          </div>

          <div class="pt-8 border-t border-slate-100 flex flex-col md:flex-row items-center justify-between gap-4">
              <p class="text-slate-400 text-sm font-bold">
                  &copy; {{ currentYear || '2026' }} Alquimia Home Deco. Todos los derechos reservados.
              </p>
          </div>
      </div>
  </footer>
</div>
