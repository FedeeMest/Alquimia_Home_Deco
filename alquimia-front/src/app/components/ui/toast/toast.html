<div class="fixed top-5 right-5 z-[9999] flex flex-col gap-3 pointer-events-none">
    @for (toast of notificationService.toasts(); track toast.id) {
        
        <div class="pointer-events-auto transform transition-all duration-300 animate-slide-in shadow-2xl rounded-xl bg-white border border-slate-100 p-4 min-w-[300px] flex justify-between items-center">
            
            <div class="flex items-center gap-3">
                <div class="inline-flex items-center justify-center shrink-0 w-10 h-10 rounded-lg"
                     [ngClass]="{
                         'bg-emerald-100 text-emerald-600': toast.type === 'success',
                         'bg-red-100 text-red-600': toast.type === 'error',
                         'bg-amber-100 text-amber-600': toast.type === 'warning',
                         'bg-blue-100 text-blue-600': toast.type === 'info'
                     }">
                    
                    @if(toast.type === 'success') {
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-6 h-6">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75 11.25 15 15 9.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
                        </svg>
                    }
                    @if(toast.type === 'error') {
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-6 h-6">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m9-.75a9 9 0 1 1-18 0 9 9 0 0 1 18 0Zm-9 3.75h.008v.008H12v-.008Z" />
                        </svg>
                    }
                    @if(toast.type === 'warning') {
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-6 h-6">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                        </svg>
                    }
                    @if(toast.type === 'info') {
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-6 h-6">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M11.25 11.25l.041-.02a.75.75 0 011.063.852l-.708 2.836a.75.75 0 001.063.853l.041-.021M21 12a9 9 0 11-18 0 9 9 0 0118 0zm-9-3.75h.008v.008H12V8.25z" />
                        </svg>
                    }
                </div>
                
                <span class="font-bold text-slate-700 text-sm max-w-[250px]">{{ toast.message }}</span>
            </div>
            
            <button (click)="notificationService.remove(toast.id)" class="text-slate-400 hover:text-slate-800 bg-white hover:bg-slate-100 p-1.5 rounded-lg transition-colors ml-4 border border-transparent hover:border-slate-200 shadow-sm">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-4 h-4">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
                </svg>
            </button>
            
        </div>
    }
</div>
